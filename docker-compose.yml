version: "3.8"

services:
  psychemitherz:
    restart: always
    build:
      context: .
      dockerfile: ./apps/psychemitherz/Dockerfile
    environment:
      MIX_ENV: prod
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    networks:
      - webnet
    command: /app/bin/psychemitherz start
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.psychemitherz.loadbalancer.server.port=4000"
      - "traefik.http.routers.psychemitherz.rule=Host(`psychemitherz.at`) || Host(`www.psychemitherz.at`)"
      - "traefik.http.routers.psychemitherz.entrypoints=websecure"
      - "traefik.http.routers.psychemitherz.tls.certresolver=http_resolver"
      
      - "traefik.http.routers.psychemitherz-pharos.rule=Host(`psychemitherz.pharos.re`)"
      - "traefik.http.routers.psychemitherz-pharos.entrypoints=websecure"
      - "traefik.http.routers.psychemitherz-pharos.tls.certresolver=http_resolver"
networks:
  webnet:
    external: true
